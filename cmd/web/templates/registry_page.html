{{define "registry-page"}}
<!DOCTYPE html>
<html>

<head>

    <title>Family gift registry</title>
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/htmx.js"></script>

    <script type="text/javascript">

        function hideForm(id) {

            document.getElementById("new-item-" + id).hidden = true;
            const listHeaders = document.getElementById("list-" + id); 

            /* Re-hide the headers if there isn't an existing item */
            if (!listHeaders) {

                document.getElementById("item-list-" + id).hidden = true;
                document.getElementById("registry-" + id + "-nothing-wanted-msg").hidden = false;

            }

        }

        function showForm(id) {
      
            document.getElementById("item-list-" + id).hidden = false;
            document.getElementById("new-item-" + id).hidden = false;

            const notWantedMsg = document.getElementById("registry-" + id + "-nothing-wanted-msg");
            if (notWantedMsg) {

                notWantedMsg.hidden = true;

            }

        }

    </script>

</head>

<body>

    <div id="application-header" class="center-text content shadowed" id="page-header">
        <h1 class="centered">
            Gift Registry
        </h1>
        <a href="/logout">Logout</a>
    </div>

    <div id="registries">
        <div id="registry-error-message" class="centered content error overflow-y shadowed" {{if eq .ErrorMessage ""}}hidden{{end}}>{{.ErrorMessage}}</div>
        {{range .Wishlists}}
        <div id="registry-{{.PersonID}}" class="centered center-text content overflow-x overflow-y shadowed">
            {{template "registry-table" .}}
        </div>
        {{end}}
    </div>

</body>

</html>
{{end}}
